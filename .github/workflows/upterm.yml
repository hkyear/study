name: Upterm Terminal

on:
  workflow_dispatch:

jobs:
  upterm:
    name: windows-terminal
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - id: upterm
        name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        with:
          detached: true
          wait-timeout-minutes: 360
          limit-access-to-actor: true
          allow-exec: true

      - name: Publish ssh command
        shell: bash
        env:
          CONN: ${{ steps.upterm.outputs.ssh-command }}
          TOKEN: ${{ github.token }}
        run: |
          content=$(printf '%s' "$CONN" | base64 -w 0)
          curl -sS -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.conn.txt" \
            -d "{\"message\":\"publish ssh command\",\"content\":\"$content\"}" \
            -o /dev/null
          printf 'ssh command: %s\n' "$CONN"
