name: Upterm Terminal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upterm:
    name: windows-terminal
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - id: upterm
        name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        with:
          detached: true
          wait-timeout-minutes: 360
          limit-access-to-actor: false
          allow-exec: true

      - name: Publish ssh command
        shell: bash
        env:
          CONN: ${{ steps.upterm.outputs.ssh-command }}
        run: |
          printf '%s\n' "$CONN" > .conn.txt
          printf 'ssh command: %s\n' "$CONN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .conn.txt
          git commit -m "publish ssh command"
          git push
